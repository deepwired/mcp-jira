# Smithery runs the published npm package directly; there is no container build.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - jiraInstance
      - jiraUserEmail
      - jiraApiToken
    properties:
      jiraInstance:
        type: string
        description: "Jira instance name (e.g. 'mycompany' for mycompany.atlassian.net)"
      jiraUserEmail:
        type: string
        description: "Email associated with the API token"
      jiraApiToken:
        type: string
        description: "Scoped API token from Atlassian (ATATT... prefix)"
      jiraScopes:
        type: string
        default: "read:jira-work"
        description: "Comma-separated scopes the server may use. Classic (read:jira-work, write:jira-work, read:jira-user, read:me) or granular (read:issue:jira, ...). Unrecognised values fail at startup."
      jiraToolsets:
        type: string
        default: "default"
        description: "Capability groups to register: core, users, attachments, links, worklogs, metadata, agile, versions, filters, labels. Also accepts 'default' and 'all'."
      jiraProjects:
        type: string
        description: "Optional allowlist of project keys (e.g. 'PROJ,OPS'). Requests naming other projects are refused before any API call."
      jiraCloudId:
        type: string
        description: "Atlassian Cloud ID (auto-fetched if not set)"
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', 'mcp-jira-scoped'],
      env: {
        JIRA_INSTANCE: config.jiraInstance,
        JIRA_USER_EMAIL: config.jiraUserEmail,
        JIRA_API_TOKEN: config.jiraApiToken,
        ...(config.jiraScopes ? { JIRA_SCOPES: config.jiraScopes } : {}),
        ...(config.jiraToolsets ? { JIRA_TOOLSETS: config.jiraToolsets } : {}),
        ...(config.jiraProjects ? { JIRA_PROJECTS: config.jiraProjects } : {}),
        ...(config.jiraCloudId ? { JIRA_CLOUD_ID: config.jiraCloudId } : {})
      }
    })
